services:
  postgres:
    image: ${POSTGRES_IMAGE}
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${POSTGRES_ADMIN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      TZ: ${TZ}
      GLITCHTIP_DB_NAME: ${GLITCHTIP_DB_NAME}
      GLITCHTIP_DB_USER: ${GLITCHTIP_DB_USER}
      GLITCHTIP_DB_PASSWORD: ${GLITCHTIP_DB_PASSWORD}
      PLANE_DB_NAME: ${PLANE_DB_NAME}
      PLANE_DB_USER: ${PLANE_DB_USER}
      PLANE_DB_PASSWORD: ${PLANE_DB_PASSWORD}
      N8N_DB_NAME: ${N8N_DB_NAME}
      N8N_DB_USER: ${N8N_DB_USER}
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ADMIN_USER} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: ${REDIS_IMAGE}
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--save",
        "60",
        "1",
        "--loglevel",
        "warning",
      ]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: ${RABBITMQ_IMAGE}
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 15s
      timeout: 10s
      retries: 10

  minio:
    image: ${MINIO_IMAGE}
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: ${MINIO_MC_IMAGE}
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      PLANE_BUCKET: ${PLANE_BUCKET}
      GLITCHTIP_BUCKET: ${GLITCHTIP_BUCKET}
    entrypoint: /bin/sh
    command:
      - -c
      - |
          set -eu
          until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do
            sleep 2
          done
          mc mb --ignore-existing local/"$$PLANE_BUCKET"
          mc mb --ignore-existing local/"$$GLITCHTIP_BUCKET"
          mc anonymous set download local/"$$PLANE_BUCKET" || true
          mc anonymous set download local/"$$GLITCHTIP_BUCKET" || true

  glitchtip:
    image: ${GLITCHTIP_IMAGE}
    restart: unless-stopped
    env_file:
      - ./services/glitchtip.env
    environment:
      GLITCHTIP_EMBED_WORKER: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    expose:
      - "8000"

  plane:
    image: ${PLANE_IMAGE}
    restart: unless-stopped
    env_file:
      - ./services/plane.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    expose:
      - "80"
    volumes:
      - plane_data:/app/data
      - plane_logs:/app/logs

  n8n:
    image: ${N8N_IMAGE}
    restart: unless-stopped
    env_file:
      - ./services/n8n.env
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "5678"
    volumes:
      - n8n_data:/home/node/.n8n

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      glitchtip:
        condition: service_started
      plane:
        condition: service_started
      n8n:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    environment:
      ACME_EMAIL: ${ACME_EMAIL}
      DOMAIN_ERRORS: ${DOMAIN_ERRORS}
      DOMAIN_TASKS: ${DOMAIN_TASKS}
      DOMAIN_FLOWS: ${DOMAIN_FLOWS}
      CADDY_BASIC_AUTH_USER: ${CADDY_BASIC_AUTH_USER}
      CADDY_BASIC_AUTH_HASH: ${CADDY_BASIC_AUTH_HASH}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  minio_data:
  n8n_data:
  plane_data:
  plane_logs:
  caddy_data:
  caddy_config:
